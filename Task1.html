<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, serif;
      background-color: #f0f4f8;
      color: #3a4550;
    }

    header {
      background-color: #dce6ef;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 10px;
    }

    nav {
      background-color: #dce6ef;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 10px;
    }

    section {
      display: flex;
      flex-direction: row;
      gap: 10px;
      margin-bottom: 10px;
    }

    aside {
      background-color: #dce6ef;
      width: 25%;
      min-height: 450px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    main {
      background-color: #dce6ef;
      flex: 1;
      min-height: 450px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    footer {
      background-color: #dce6ef;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <header>Header</header>

  <nav>Navigation Menu</nav>

  <section>
    <aside>Content</aside>
    <main>Main Content</main>
    <aside>Content</aside>
  </section>

  <footer>Footer</footer>

</body>
</html>
